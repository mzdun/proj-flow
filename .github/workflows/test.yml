name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Run tests with coverage
        run: >
          python -m pytest
          --cov
          --cov-report=term
          --cov-report=xml
          --junitxml=test-results.xml

      - name: Coverage summary
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12' }}
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            test-results.xml
            coverage.xml

  docstrings:
    name: Docstring coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install "interrogate~=1.7"

      - name: Check docstrings
        # settings, including fail-under, live in [tool.interrogate]
        run: |
          python -m interrogate src/proj_flow | tee interrogate.txt
          {
            echo "## Docstring coverage"
            echo '```'
            tail -n 3 interrogate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Package sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install . build twine

      - name: Build and check with proj-flow
        # the same "Build" and "Check Twine" steps used locally
        run: python -m proj_flow verify

      - name: Strict twine check
        # "Check Twine" passes when it finds no packages; make sure there are some
        run: |
          ls dist/*.whl dist/*.tar.gz
          python -m twine check --strict dist/*

      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install dist/*.whl
          cd /tmp
          expected="proj-flow version $(python -c 'import proj_flow; print(proj_flow.__version__)')"
          actual="$(/tmp/wheel-env/bin/proj-flow --version)"
          echo "$actual"
          test "$actual" = "$expected"
          /tmp/wheel-env/bin/proj-flow --help > /dev/null

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dists
          path: dist/
